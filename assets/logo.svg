<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52" role="img" aria-label="Cat Ilacad — CEO Systems Method™">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=DM+Sans:opsz,wght@9..40,600&amp;display=swap');
      .l-mark  { fill: #C4748A; }
      .l-accent { fill: #C9A84C; }
      .l-div   { stroke: #F2DDE4; stroke-width: 1.2; }
      .l-name  { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 21px; letter-spacing: -0.4px; }
      .l-dark  { fill: #3D1F2E; }
      .l-rose  { fill: #C4748A; }
      .l-sub   { font-family: 'DM Sans', Arial, sans-serif; font-weight: 600; font-size: 7px; letter-spacing: 1.6px; fill: #9B6677; }
    </style>
  </defs>

  <!-- ✦ Four-pointed star mark -->
  <path class="l-mark" d="M22,11 L24.8,22.2 L36,25 L24.8,27.8 L22,39 L19.2,27.8 L8,25 L19.2,22.2 Z"/>

  <!-- Gold diamond accent -->
  <path class="l-accent" d="M22,42 L24.2,45 L22,48 L19.8,45 Z"/>

  <!-- Vertical divider -->
  <line class="l-div" x1="46" y1="11" x2="46" y2="41"/>

  <!-- Wordmark -->
  <text class="l-name" y="31">
    <tspan x="55" class="l-dark">Cat </tspan><tspan class="l-rose">Ilacad</tspan>
  </text>

  <!-- Tagline -->
  <text class="l-sub" x="55" y="44">CEO SYSTEMS METHOD™</text>
</svg>
